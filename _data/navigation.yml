# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site.
#
# This nav matches the order/labels of the reference site Thomas asked to
# match (yujin1007.github.io), minus Publications (no real content yet).
# "About Me", "Educations", "News", and "Honors and Awards" are anchor links
# that jump to sections on the homepage (_pages/about.md) — they don't have
# their own page. "Projects" and "Teaching" are the two links that go to a
# separate page, per Thomas's request. CV isn't in the top nav — it's a link
# in the sidebar instead (see _includes/author-profile.html / _config.yml
# author.cv).
#
# If you add Publications back later (see HOW_TO_CUSTOMIZE.md), a natural
# spot is right after "Projects", matching the reference site's order.

main:
  - title: "About Me"
    url: /#about-me

  - title: "Education"
    url: /#education

  - title: "News"
    url: /#news

  - title: "Honors and Awards"
    url: /#honors-and-awards

  - title: "Projects"
    url: /portfolio/

  - title: "Teaching"
    url: /teaching/
