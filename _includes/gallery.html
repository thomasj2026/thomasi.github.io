{%- if page.gallery -%}
<div class="gallery" data-gallery>
  <div class="gallery__viewport">
    {%- for img in page.gallery -%}
    <figure class="gallery__slide{% if forloop.first %} is-active{% endif %}">
      {%- if img.text -%}
      <div class="gallery__text">{{ img.text }}</div>
      {%- else -%}
      <img src="{{ base_path }}/images/portfolio/{{ img.file | default: img }}" alt="{{ img.alt | default: page.title }}">
      {%- endif -%}
      {%- if img.caption -%}<figcaption>{{ img.caption }}</figcaption>{%- endif -%}
    </figure>
    {%- endfor -%}
    <button class="gallery__btn gallery__fs" type="button" aria-label="Toggle full screen" title="Full screen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
    {%- if page.gallery.size > 1 -%}
    <button class="gallery__btn gallery__btn--prev" type="button" aria-label="Previous image">&#10094;</button>
    <button class="gallery__btn gallery__btn--next" type="button" aria-label="Next image">&#10095;</button>
    <div class="gallery__count"><span data-gallery-index>1</span> / {{ page.gallery.size }}</div>
    {%- endif -%}
  </div>
</div>
<script>
  document.querySelectorAll('[data-gallery]').forEach(function (g) {
    var slides = g.querySelectorAll('.gallery__slide');
    var idx = 0;
    function show(n) {
      slides[idx].classList.remove('is-active');
      idx = (n + slides.length) % slides.length;
      slides[idx].classList.add('is-active');
      var c = g.querySelector('[data-gallery-index]');
      if (c) c.textContent = idx + 1;
    }
    var prev = g.querySelector('.gallery__btn--prev');
    var next = g.querySelector('.gallery__btn--next');
    if (prev) prev.addEventListener('click', function () { show(idx - 1); });
    if (next) next.addEventListener('click', function () { show(idx + 1); });
    function isFs() { return document.fullscreenElement === g || document.webkitFullscreenElement === g || g.classList.contains('is-fullscreen'); }
    function toggleFs() {
      if (isFs()) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        g.classList.remove('is-fullscreen');
      } else if (g.requestFullscreen) {
        g.requestFullscreen();
      } else if (g.webkitRequestFullscreen) {
        g.webkitRequestFullscreen();
      } else {
        g.classList.add('is-fullscreen');
      }
      g.focus();
    }
    g.querySelector('.gallery__fs').addEventListener('click', toggleFs);
    g.setAttribute('tabindex', '0');
    g.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') show(idx - 1);
      if (e.key === 'ArrowRight') show(idx + 1);
      if (e.key === 'Escape') g.classList.remove('is-fullscreen');
    });
  });
</script>
{%- endif -%}
