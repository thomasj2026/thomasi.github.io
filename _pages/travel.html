{% include base_path %}

<p>Places I have been to throughout my life! Drag the globe to spin it, then click a pin (or pick a place below) to see photos!</p>

  </div>
</div>

<div class="travel__list" id="travel-list"></div>

<script>
  window.TRAVEL_BASE = "{{ base_path }}";

</script>
